server {
    listen 80;

    # Serve custom CSS โดยตรงจาก filesystem ใน nginx container
    # ไม่ proxy ผ่าน monograph-server เพื่อป้องกัน 404
    location = /custom.css {
        alias /etc/nginx/custom/custom.css;
        add_header Content-Type text/css;
    }

    location / {
        # Proxy ทุก request ไปยัง monograph-server ที่รันอยู่ใน Docker network
        proxy_pass http://monograph-server:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject <link> tag ก่อนปิด </head> ในทุก HTML response
        sub_filter '</head>' '<link rel="stylesheet" href="/custom.css"></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
