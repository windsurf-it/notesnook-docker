server {
    listen 80;

    location / {
        # Proxy ทุก request ไปยัง monograph-server ที่รันอยู่ใน Docker network
        proxy_pass http://monograph-server:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject <link> tag ก่อนปิด </head> ในทุก HTML response
        # เพื่อโหลด custom.css ที่ mount เข้ามาจาก host
        sub_filter '</head>' '<link rel="stylesheet" href="/custom.css"></head>';
        sub_filter_once on;       # inject แค่ครั้งเดียวต่อ response
        sub_filter_types text/html;
    }
}
